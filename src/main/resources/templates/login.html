<!DOCTYPE html>
<!-- 名前とパスワードをログイン処理へ送信する。 -->
<html>
         <head>
                  <meta charset="utf-8">
                  <title>ログインページ</title>
                  <link rel="stylesheet" th:href="@{./css/login.css}">
                  <!-- <link rel="stylesheet" href="../static/css/login.css"> -->
         </head>
         <body>
                  <div class="main">
                           <h1>ログイン</h1>
                           <div class = error th:text="${str}"></div>
                           <form th:action="@{/login}" method="post">
                                    <input type="text" name="username" required placeholder="ユーザーネーム">
                                    <input type="password" name="password" required placeholder="パスワード">
                                    <button type="submit">ログイン</button>
                           </form>
                           <div class="nav">
                                    <a th:href="@{http://localhost:8080/personedit}">従業員新規登録</a>
                                    
                           </div>
         
                  </div>
         </body>
</html>
