<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト管理</title><link rel="stylesheet" href="/css/metal.css"></head><body><main class="main"><nav><a href="/timecard">打刻</a>　<a href="/admin/calendar">カレンダー</a>　<a href="/admin/employee-list">従業員</a></nav><h1>シフト管理</h1><p class="note">登録済みシフトは下の一覧で編集・削除できます。休憩は分単位、勤務は同日内で入力してください。</p><p role="status" th:text="${message}"></p><h2>新規登録</h2><form class="shift-form" th:action="@{/admin/shifts/save}" method="post"><label>従業員<select name="person" required><option th:each="p:${people}" th:value="${p.id}" th:text="${p.name}"></option></select></label><label>日付<input type="date" name="date" required></label><label>開始<input type="time" name="go" required></label><label>終了<input type="time" name="out" required></label><label>休憩（分）<input type="number" name="breakMinutes" value="0" min="0" max="1439" required></label><button>登録</button></form><h2>登録済みシフト</h2><p th:if="${#lists.isEmpty(records)}">シフトはまだありません。</p><article th:each="s:${records}"><form class="shift-form" th:action="@{/admin/shifts/save}" method="post"><input type="hidden" name="id" th:value="${s.id}"><label>従業員<select name="person" required><option th:each="p:${people}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == s.person.id}"></option></select></label><label>日付<input type="date" name="date" th:value="${s.date}" required></label><label>開始<input type="time" name="go" th:value="${s.go}" required></label><label>終了<input type="time" name="out" th:value="${s.out}" required></label><label>休憩（分）<input type="number" name="breakMinutes" th:value="${s.breakTime.intValue()}" min="0" max="1439" required></label><button>変更を保存</button></form><form th:action="@{/admin/shifts/delete}" method="post" onsubmit="return confirm('このシフトを削除しますか？')"><input type="hidden" name="id" th:value="${s.id}"><button>削除</button></form><hr></article></main></body></html>
