<!DOCTYPE html>
    <html lang="ja">
        <head>
            <meta charset="UTF-8">
            <title>従業員検索</title>
            <link rel="stylesheet" th:href="@{/css/employee-list.css}">
        </head>
        <body>
            <div class="main">
                <div class="nav">
                    <a th:href="@{http://localhost:8080/timecard}" class="link">打刻画面</a><br>
                    
                  </div>
                <div class="employee-form">
                    <!-- 検索フォーム -->
                    <form th:action="@{/employee/shiftkintaiinfo}" method="get">
                        <div>
                            <label for="name" style="color:white">従業員検索</label>
                            <input type="number" id="" name="id" required placeholder="従業員IDを入力してください">
                            <button type="submit">検索</button>
                            <div th:text="${error}" style="color:red"></div>
                        </div>
                    </form>
                </div>
                <div>
                    <form th:action="@{/employee/shiftkintaiinfo}" method="get" class="employee-table-form">
                    <table class="employee-table">
                        <thead>
                            <tr><th class="top-left">従業員ID</th><th class="top-right">名前</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${list}">
                                <td><button name="id" th:value="${item.id}" th:text="${item.id}">1</button></td>
                                <td><button name="name" th:value="${item.name}" th:text="${item.name}">高橋</button></td>
                            </tr>
                        </tbody>
                    </table>
                    </form>
                </div>
            </div>
    </body>
</html>
